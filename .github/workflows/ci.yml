name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25', 'stable']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        cache: false

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      run: go test -v -race ./...

    - name: Run tests (Unix)
      if: runner.os != 'Windows'
      run: go test -v -race -coverprofile=coverage.txt ./...

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.txt
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        cache: false

    - name: Build without git support
      run: go build -v ./cmd/datum

    - name: Build with git support
      run: go build -v -tags git ./cmd/datum

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        # Pinned rather than 'stable': golangci-lint v2.6.0's own binary is built against an
        # older Go toolchain and panics ("file requires newer Go version") when it type-checks
        # code built with a newer one - 'stable' now resolves to Go 1.26, which triggers this.
        # Plain `go build`/`go test` don't have this problem, only golangci-lint's embedded
        # go/types does. Bump this alongside golangci-lint's own version, not independently.
        go-version: '1.25'
        cache: false

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.6.0
        args: --timeout=5m

  examples:
    name: Test Examples
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        cache: false

    - name: Build datum with git support
      run: go build -tags git -o datum ./cmd/datum

    - name: Test basic example (HTTP handler)
      run: |
        cd examples/basic
        ../../datum --config .data.yaml fetch
        ../../datum --config .data.yaml check

    - name: Test git example (Git handler)
      run: |
        cd examples/git-one-file
        ../../datum --config .data.yaml fetch
        ../../datum --config .data.yaml check

    - name: Test directory-sync example (File handler, directory source)
      run: |
        cd examples/directory-sync
        ../../datum --config .data.yaml fetch
        ../../datum --config .data.yaml check

  integration:
    name: Integration (git over SSH)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        cache: false

    - name: Run Docker-based integration tests
      run: bash scripts/test-integration.sh
