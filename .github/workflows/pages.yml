name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-flight one finish rather than cancelling it, since
# cancelling a live Pages deploy mid-upload can leave the site in a half-updated state.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Repo settings (homepage/description/etc.) aren't in the default GITHUB_TOKEN's reach -
      # "administration" isn't a permission this token can be granted at all, regardless of what
      # the permissions: block above declares (confirmed: adding it made GitHub reject the whole
      # workflow file as invalid, blocking every future run until reverted here). Updating the
      # repo's Website field this way would need a PAT with repo-admin rights stored as a secret.
      # Set by hand for now: https://jprybylski.github.io/datum/
