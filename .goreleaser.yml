version: 2

project_name: datum

before:
  hooks:
    - go mod tidy

builds:
  - id: datum
    main: ./cmd/datum
    binary: datum
    tags:
      - git
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

# Release notes come from the matching CHANGELOG.md section instead, passed via
# `goreleaser release --release-notes=...` in .github/workflows/release.yml. Deliberately NOT
# setting changelog.disable: true here to skip goreleaser's own commit-log changelog - its docs
# warn that disable:true also makes it silently ignore --release-notes and render an empty body
# (confirmed the hard way: v1.2.0's first release went out with an empty description because of
# this). Leaving changelog at its default is fine: --release-notes takes priority over it anyway.

release:
  github:
    owner: jprybylski
    name: datum
